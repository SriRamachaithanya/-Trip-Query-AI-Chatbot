[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trip-query-ai-chatbot"
version = "0.2.0"
description = "Production-style RAG AI evaluation & tracing system for travel queries"
authors = [
    { name = "FOXO AI Engineering Candidate" }
]
readme = "readme.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
rag = [
    "pandas>=2.0.0",
    "chromadb>=0.4.22",
    "langchain-core>=0.2.0",
    "langchain-chroma>=0.1.0",
    "langchain-ollama>=0.1.0"
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

